name: Reusable Release Gate

on:
  workflow_call:
    inputs:
      release_base:
        description: Base commit for release-range governance checks.
        required: true
        type: string
      release_head:
        description: Exact candidate commit to validate.
        required: true
        type: string
      candidate_base:
        description: Exact dev base of the deterministic Release PR.
        required: false
        default: ''
        type: string
      release_version:
        description: Stable package version bound into the candidate proof.
        required: false
        default: ''
        type: string
      emit_proof:
        description: Emit an exact PR gate proof after every gate step succeeds.
        required: false
        default: false
        type: boolean
      proof_pr_number:
        description: Pull request number bound into the emitted proof.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_head }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch main
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') || hashFiles('npm-shrinkwrap.json') || hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Verify reviewed LCIA cache bundle
        run: npm run lcia-cache:verify

      - name: Run docpact release gate
        env:
          RELEASE_BASE: ${{ inputs.release_base }}
          RELEASE_HEAD: ${{ inputs.release_head }}
        run: npm run docpact:gate -- --base "$RELEASE_BASE" --head "$RELEASE_HEAD"

      - name: Verify static release readiness
        run: npm run release:static-preflight

      - name: Run full release gate
        env:
          TIANGONG_AGENT_MODE: '1'
          TIANGONG_TEST_LOG_DIR: .local/test-logs/release-gate-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run prepush:gate

      - name: Upload full Jest logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-jest-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-logs/**
          if-no-files-found: ignore
          retention-days: 7

  semantic-qualification:
    name: Content-addressed Semantic Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_head }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve qualification proof key
        id: qualification-identity
        run: |
          set -euo pipefail
          identity_json="$(npm --silent run e2e:qualification:key -- --format=json)"
          proof_key="$(jq -r '.result.proofKey' <<< "$identity_json")"
          if [[ ! "$proof_key" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Qualification identity did not return a valid proof key."
            exit 1
          fi
          echo "proof_key=$proof_key" >> "$GITHUB_OUTPUT"

      - name: Restore behavior-equivalent qualification proof
        id: qualification-cache
        uses: actions/cache@v5
        with:
          path: .local/e2e-release/qualification-proof.json
          key: semantic-qualification-${{ runner.os }}-${{ steps.qualification-identity.outputs.proof_key }}

      - name: Verify restored qualification proof
        if: steps.qualification-cache.outputs.cache-hit == 'true'
        run: >-
          npm --silent run release:proof:verify -- --proof .local/e2e-release/qualification-proof.json --format=json

      - name: Run complete semantic qualification
        if: steps.qualification-cache.outputs.cache-hit != 'true'
        run: >-
          npm --silent run e2e:qualify -- --proof .local/e2e-release/qualification-proof.json --format=json --output .local/e2e-release/qualification-controller-report.json

      - name: Verify generated qualification proof
        run: >-
          npm --silent run release:proof:verify -- --proof .local/e2e-release/qualification-proof.json --format=json

      - name: Upload semantic qualification proof
        uses: actions/upload-artifact@v6
        with:
          name: semantic-qualification-${{ steps.qualification-identity.outputs.proof_key }}
          path: |
            .local/e2e-release/qualification-proof.json
            .local/e2e-release/qualification-controller-report.json
          if-no-files-found: error
          retention-days: 30

  release-proof:
    name: Aggregate Exact Release Proof
    needs:
      - release-gate
      - semantic-qualification
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact candidate
        if: inputs.emit_proof
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_head }}
          fetch-depth: 0

      - name: Write exact aggregate release proof
        id: release-proof
        if: inputs.emit_proof
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/release-gate-proof.json
          PROOF_PR_NUMBER: ${{ inputs.proof_pr_number }}
          RELEASE_BASE: ${{ inputs.release_base }}
          CANDIDATE_BASE: ${{ inputs.candidate_base }}
          RELEASE_HEAD: ${{ inputs.release_head }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: >-
          node scripts/release/release-gate-proof.cjs create --repository "$GITHUB_REPOSITORY" --pr-number "$PROOF_PR_NUMBER" --release-base "$RELEASE_BASE" --candidate-base "$CANDIDATE_BASE" --release-head "$RELEASE_HEAD" --release-version "$RELEASE_VERSION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$PROOF_OUTPUT" --github-output "$GITHUB_OUTPUT"

      - name: Upload exact aggregate release proof
        if: inputs.emit_proof
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release-proof.outputs.artifact_name }}
          path: ${{ steps.release-proof.outputs.proof_path }}
          if-no-files-found: error
          retention-days: 30
