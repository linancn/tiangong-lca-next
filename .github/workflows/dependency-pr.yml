name: Dependency PR validation

on:
  pull_request:
    branches: [dev, main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .github/dependabot.yml
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-pr-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-gate:
    # Protected release phases already have an exact validation owner. Their
    # existing candidate checks validate every marker/lineage before success.
    if: >-
      github.event_name != 'pull_request' || !(
        (
          github.event.pull_request.base.ref == 'dev' &&
          contains(github.event.pull_request.body || '', 'tiangong-next-release-automation:v2')
        ) ||
        (
          github.event.pull_request.base.ref == 'main' &&
          (
            github.event.pull_request.head.ref == 'dev' ||
            startsWith(github.event.pull_request.head.ref, 'codex/promote-') ||
            startsWith(github.event.pull_request.head.ref, 'codex/hotfix-')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run canonical non-release gate
        env:
          TIANGONG_AGENT_MODE: '1'
          TIANGONG_TEST_LOG_DIR: .local/test-logs/dependency-pr-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm prepush:gate
      - name: Preserve complete test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-pr-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-logs/**
          if-no-files-found: ignore
          retention-days: 7
